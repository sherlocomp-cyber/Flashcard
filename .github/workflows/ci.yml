name: CI

on:
  push:
    branches: [main, build/app]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Lockfile dipakai bila ada (build bisa diulang persis); tanpa lockfile jatuh ke npm install.
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm test
      - run: npm run build
