name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Lockfile dipakai bila ada (build bisa diulang persis); tanpa lockfile jatuh ke npm install.
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm test
      - run: npm run build

      - name: Nomor versi dari tag
        run: |
          echo "Tag: $GITHUB_REF_NAME"
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Siapkan proyek Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          # Android minimum 8 (API 26)
          sed -i 's/minSdkVersion = .*/minSdkVersion = 26/' android/variables.gradle
          # versionCode naik mengikuti tag (v1.2.3 menjadi 10203) supaya APK baru bisa menimpa yang lama
          IFS=. read -r MA MI PA <<< "$VERSION_NAME"
          MA=${MA%%[!0-9]*}; MI=${MI%%[!0-9]*}; PA=${PA%%[!0-9]*}
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          sed -i "s/versionCode .*/versionCode $CODE/; s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Bangun APK
        id: build
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk "../flashcard-${GITHUB_REF_NAME}.apk"
            echo "note=APK bertanda tangan rilis." >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../flashcard-${GITHUB_REF_NAME}-debug.apk"
            echo "note=APK debug (belum ada rahasia kunci rilis). Aman dipasang untuk uji, bukan untuk toko aplikasi." >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: flashcard-*.apk
          body: ${{ steps.build.outputs.note }}
